# Always-loaded defaults (merged under application.conf, and picked up by the
# test profiles too). Kept here rather than in application.conf so the wiring
# below can never be lost by a site editing its own application.conf.

# Choose the Evolutions SQL flavour from db.default.driver instead of a
# hand-maintained conf/evolutions/<db>/<n>.sql symlink: swap Play's default
# EvolutionsModule for one whose EvolutionsReader reads <n>-postgres.sql /
# <n>-mysql.sql (see modules.FlavoredEvolutionsReader).
play.modules.disabled += "play.api.db.evolutions.EvolutionsModule"
play.modules.enabled  += "modules.FlavoredEvolutionsModule"
